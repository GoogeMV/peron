<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>peron · live map</title>
    <style>
      /* The map is a night scene by design, whatever the system theme. */
      :root {
        color-scheme: dark;
        --bg: #07090d;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --panel: rgba(20, 22, 27, 0.78);
        --border: rgba(255, 255, 255, 0.1);
        --good: #0ca30c;
        --warning: #fab219;
        --critical: #d03b3b;
        --other: #9aa0ab;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 14px / 1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .panel {
        position: fixed;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(8px);
      }
      #hud {
        top: 16px;
        left: 16px;
        min-width: 230px;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--critical);
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      #clock {
        margin: 2px 0 12px;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 3px 0;
        color: var(--ink-2);
      }
      .stat strong {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #controls {
        top: 16px;
        right: 16px;
        display: flex;
        gap: 6px;
        padding: 6px;
      }
      #controls button,
      #controls a {
        font: inherit;
        color: var(--ink-2);
        background: none;
        border: 0;
        border-radius: 9px;
        padding: 6px 12px;
        cursor: pointer;
        text-decoration: none;
      }
      #controls button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        font-weight: 600;
      }
      #legend {
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 5px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .key {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .key i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      #credit {
        position: fixed;
        right: 16px;
        bottom: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      #credit a {
        color: inherit;
      }
      #tooltip {
        position: fixed;
        z-index: 5;
        pointer-events: none;
        padding: 8px 11px;
        border-radius: 9px;
        background: var(--ink);
        color: var(--bg);
        font-size: 13px;
        line-height: 1.4;
        white-space: nowrap;
      }
      #tooltip strong {
        display: block;
      }
      :focus-visible {
        outline: 2px solid #3987e5;
        outline-offset: 2px;
      }
      @media (max-width: 640px) {
        #legend {
          display: none;
        }
        #hud {
          min-width: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .live-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="base" aria-hidden="true"></canvas>
    <canvas id="trails" aria-hidden="true"></canvas>
    <canvas
      id="trains"
      role="img"
      aria-label="Live positions of trains on the Finnish rail network"
    ></canvas>

    <section id="hud" class="panel" aria-live="polite">
      <h1 class="title"><span class="live-dot" aria-hidden="true"></span>peron · <span id="mode">live</span></h1>
      <p id="clock"></p>
      <div class="stat"><span id="stat-count-label">Trains reporting</span><strong id="stat-count">–</strong></div>
      <div class="stat"><span>Passenger on time</span><strong id="stat-ontime">–</strong></div>
      <div class="stat"><span>Most delayed</span><strong id="stat-worst">–</strong></div>
    </section>

    <nav id="controls" class="panel" aria-label="Map view">
      <button type="button" data-view="finland" aria-pressed="true">Finland</button>
      <button type="button" data-view="helsinki" aria-pressed="false">Helsinki region</button>
      <button type="button" id="replay-toggle" aria-pressed="false">Replay yesterday</button>
      <a href="/">Statistics</a>
    </nav>

    <section id="legend" class="panel" aria-label="Legend">
      <span class="key"><i style="background: var(--good)"></i>On time</span>
      <span class="key"><i style="background: var(--warning)"></i>Late</span>
      <span class="key"><i style="background: var(--critical)"></i>15+ minutes late</span>
      <span class="key"><i style="background: var(--other)"></i>Freight and service trains</span>
    </section>

    <p id="credit">
      Positions: <a href="https://www.digitraffic.fi/en/railway-traffic/">Fintraffic / digitraffic.fi</a>,
      CC BY 4.0
    </p>
    <div id="tooltip" hidden></div>
    <script type="module" src="/static/map.js"></script>
  </body>
</html>
