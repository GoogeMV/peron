name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t peron:ci .
      - name: Smoke test
        run: |
          # COLLECT=false: CI must not depend on, or load, the public feed.
          docker run -d --rm -p 8080:8080 -e COLLECT=false --name peron peron:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 0.5
          done
          curl -fsS "http://localhost:8080/api/dashboard?days=7" | grep -q '"runs":0'
          curl -fsS http://localhost:8080/ | grep -q peron
          docker stop peron
